# CI: backend lint + tests (real Postgres/pgvector + Redis), frontend lint/typecheck/build, browser E2E against the
# full stack (API + Celery worker + next start), and Docker image builds. No secrets needed: every AI/mail/SMS adapter
# is the labelled dev one, and no step calls a billed provider.
name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

env:
  ABOS_DATABASE_URL: postgresql+psycopg://abos:abos_dev_password@127.0.0.1:5432/abos
  ABOS_TEST_DATABASE_URL: postgresql+psycopg://abos:abos_dev_password@127.0.0.1:5432/abos_test
  ABOS_REDIS_URL: redis://127.0.0.1:6379/0

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: abos, POSTGRES_PASSWORD: abos_dev_password, POSTGRES_DB: abos }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U abos" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Databases (same as infra/postgres/init)
        run: PGPASSWORD=abos_dev_password psql -h 127.0.0.1 -U abos -d abos -f ../infra/postgres/init/01-init.sql
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Migrations have no drift
        run: alembic upgrade head && alembic check
      - name: Tests (migrate down/up, security surface, tenancy, RAG security, privacy, performance …)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: abos, POSTGRES_PASSWORD: abos_dev_password, POSTGRES_DB: abos }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U abos" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env: { ABOS_JOBS_EAGER: "false" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend
        working-directory: backend
        run: |
          PGPASSWORD=abos_dev_password psql -h 127.0.0.1 -U abos -d abos -c "CREATE EXTENSION IF NOT EXISTS vector"
          pip install -e .
          alembic upgrade head
          nohup uvicorn abos.main:app --port 8470 > ../api.log 2>&1 &
          nohup celery -A abos.jobs.worker worker --pool=solo -Q abos --loglevel=info > ../worker.log 2>&1 &
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > ../web.log 2>&1 &
          npx wait-on -t 120000 http://127.0.0.1:8470/api/health/ready http://localhost:3470/
      - name: Playwright (installed Chrome, axe gate)
        working-directory: frontend
        run: npx playwright test
      - name: No errors in API or worker logs
        if: always()
        run: |
          ! grep -E '"level": "ERROR"|Traceback' api.log worker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-artifacts, path: "frontend/test-results\n*.log" }

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t abos-backend:ci backend
      - run: docker build -t abos-web:ci frontend
