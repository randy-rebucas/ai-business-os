[project]
name = "abos-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",        # background jobs (ADR-008)
  "pgvector>=0.3",             # vector column type for SQLAlchemy
  "pypdf>=5",                  # PDF text extraction
  "python-docx>=1.1",          # DOCX extraction
  "openpyxl>=3.1",             # XLSX extraction
  "anthropic>=1.13,<2",        # Claude adapter of the LLM gateway (ADR-012)
  "pillow>=12",                # workspace logos: decode, re-encode, palette (ADR-035)
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
# OCR for scanned PDFs also needs the Tesseract binary on PATH (ADR-014).
ocr = ["pytesseract>=0.3", "pypdfium2>=4"]
s3 = ["boto3>=1.34"]                 # ABOS_STORAGE_BACKEND=s3
monitoring = ["sentry-sdk>=2"]       # ABOS_ERROR_REPORTER=sentry

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["abos*"]

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"abos/seed.py" = ["S105", "S106"]
"abos/core/migration_sql.py" = ["S608"]  # DDL built from module constants and table names, never user input

[tool.pytest.ini_options]
testpaths = ["tests"]
